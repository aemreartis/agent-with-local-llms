memory:
  default: "inmemory"
  providers:
    inmemory:
      class: "providers.memory.inmemory_provider.InMemoryProvider"
      config:
        max_size: 1000
        default_ttl: 3600
        cleanup_interval: 300
    redis:
      class: "providers.memory.redis_provider.RedisMemoryProvider"
      config:
        host: "localhost"
        port: 6379
        db: 0
        password: null
        prefix: "agentic_rag:"
        default_ttl: 3600
    postgresql:
      class: "providers.memory.postgresql_provider.PostgreSQLMemoryProvider"
      config:
        host: "localhost"
        port: 5432
        database: "agentic_rag"
        username: "postgres"
        password: "password"
        table_name: "conversation_memory"
        max_connections: 10 