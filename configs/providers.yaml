memory:
  default: "hybrid"
  providers:
    inmemory:
      class: "providers.memory.inmemory_provider.InMemoryProvider"
      config:
        max_size: 1000
        default_ttl: 3600
        cleanup_interval: 300
    redis:
      class: "providers.memory.redis_provider.RedisMemoryProvider"
      config:
        host: "localhost"
        port: 6380
        db: 0
        password: null
        prefix: "agentic_rag:"
        default_ttl: 3600
    postgresql:
      class: "providers.memory.postgresql_provider.PostgreSQLMemoryProvider"
      config:
        host: "localhost"
        port: 5433
        database: "agentic_rag"
        username: "rag_user"
        password: "rag_password"
        table_name: "conversation_memory"
        max_connections: 10
    hybrid:
      class: "providers.memory.hybrid_provider.HybridMemoryProvider"
      config:
        redis_ttl: 3600  # 1 hour in Redis
        migration_enabled: true
        migration_batch_size: 100
        redis:
          host: "localhost"
          port: 6380
          db: 0
          password: null
          prefix: "agentic_rag:"
          default_ttl: 3600
        postgresql:
          host: "localhost"
          port: 5433
          database: "agentic_rag"
          username: "rag_user"
          password: "rag_password"
          table_name: "conversation_memory"
          max_connections: 10

# Document Processing Providers
document_loader:
  default: "text"
  providers:
    text:
      class: "src.providers.document.text_loader.TextDocumentLoader"
      config:
        max_file_size: 10485760  # 10MB
        supported_extensions: [".txt", ".md", ".csv", ".html", ".json"]

document_chunker:
  default: "text"
  providers:
    text:
      class: "src.providers.document.text_chunker.TextChunker"
      config:
        chunk_size: 1000
        chunk_overlap: 200
        min_chunk_size: 100

document_processor:
  default: "text"
  providers:
    text:
      class: "src.providers.document.text_processor.TextProcessor"
      config:
        normalize_whitespace: true
        normalize_unicode: true
        remove_html_tags: true
        extract_metadata: true
        language_detection: true

document_pipeline:
  default: "text"
  providers:
    text:
      class: "src.providers.document.document_pipeline.DocumentPipeline"
      config:
        loader:
          max_file_size: 10485760
          supported_extensions: [".txt", ".md", ".csv", ".html", ".json"]
        processor:
          normalize_whitespace: true
          normalize_unicode: true
          remove_html_tags: true
          extract_metadata: true
          language_detection: true
        chunker:
          chunk_size: 1000
          chunk_overlap: 200
          min_chunk_size: 100 