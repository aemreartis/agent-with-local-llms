apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-rag-config
  namespace: agentic-rag
  labels:
    app: agentic-rag
    environment: production
data:
  app_config.yaml: |
    app:
      name: agentic-rag
      version: 1.0.0
      environment: production
      debug: false
    
    database:
      host: postgresql-service
      port: 5432
      name: agentic_rag
      pool_size: 10
      max_overflow: 20
    
    redis:
      host: redis-service
      port: 6379
      db: 0
      max_connections: 20
    
    vllm:
      host: vllm-service
      port: 8001
      model_name: llama-2-7b
      max_model_len: 4096
    
    qdrant:
      host: qdrant-service
      port: 6333
      collection_name: documents
    
    monitoring:
      prometheus_enabled: true
      grafana_enabled: true
      log_level: INFO
    
    security:
      jwt_secret_key: ${JWT_SECRET}
      bcrypt_rounds: 12
      cors_origins: ["https://api.agentic-rag.com"]
    
    rate_limiting:
      requests_per_minute: 100
      burst_size: 20 