apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: agentic-rag
  labels:
    app: fastapi-app
    environment: production
spec:
  selector:
    app: fastapi-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
    name: http
  type: LoadBalancer
  sessionAffinity: None 