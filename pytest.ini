[tool:pytest]
minversion = 6.0
addopts = 
    -v
    --tb=short
    --asyncio-mode=auto
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
    --disable-warnings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests for individual components
    integration: Integration tests between components  
    e2e: End-to-end system tests
    slow: Tests that take a long time to run
    provider: Tests for specific provider implementations
    interface: Tests for interface contracts 